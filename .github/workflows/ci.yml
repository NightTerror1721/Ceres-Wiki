name: wiki

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Regenerates the tables that depend only on pinned data and fails if the fragments are stale.
      # The stdlib index reads the STDLIB checkout, which CI does not have, so it is committed
      # and regenerated by hand (tools/gen/gen-stdlib-index.mjs).
      - name: gen-tables
        run: |
          node tools/gen/gen-tables.mjs
          node tools/gen/gen-cli.mjs
          git diff --exit-code content/en/_gen
      # Renders every page + content lint (v1 terms, es/en parity, links).
      - name: selfcheck
        run: node tools/selfcheck.js
      # Static export: proves the generator does not fail.
      - name: build
        run: node tools/build.js
