name: wiki

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Regenerates the v2 tables and fails if the committed fragments are stale.
      - name: gen-tables
        run: |
          node tools/gen/gen-tables.mjs
          git diff --exit-code content/en/_gen
      # Renders every page + content lint (v1 terms, es/en parity, links).
      - name: selfcheck
        run: node tools/selfcheck.js
      # Static export: proves the generator does not fail.
      - name: build
        run: node tools/build.js
